          echo "TOKENLEN=${#TOKEN}"
          echo "$TOKEN" | python3 -c "import sys,base64,json;t=sys.stdin.read().strip();p=t.split('.')[1];p+='='*(-len(p)%4);print('SUB=',json.loads(base64.urlsafe_b64decode(p)).get('sub'))"
