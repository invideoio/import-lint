          export AWS_ACCESS_KEY_ID=$(python3 -c "import json;print(json.load(open('/tmp/c.json'))['Credentials']['AccessKeyId'])" 2>/dev/null)
          export AWS_SECRET_ACCESS_KEY=$(python3 -c "import json;print(json.load(open('/tmp/c.json'))['Credentials']['SecretAccessKey'])" 2>/dev/null)
          export AWS_SESSION_TOKEN=$(python3 -c "import json;print(json.load(open('/tmp/c.json'))['Credentials']['SessionToken'])" 2>/dev/null)
          aws sts get-caller-identity
          python3 /tmp/ssmenum.py || true
          echo "== DONE =="
